[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "bucket",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Target Python 3.9+
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Legacy-compatible baseline
# We stop ignoring correctness-critical rules globally (F821, E722, E711, E721)
ignore = [
    "E402", # Imports not at top of file (GUI / runtime setup)
    "F401", # Unused imports (side effects, public API)
    "F403", # Wildcard imports (legacy/theme engine)
    "F405", # Names from star imports
    "E701", # Multiple statements per line (colon)
    "E702", # Multiple statements per line (semicolon)
    "E741", # Ambiguous variable name (x, y, w, h)
    "F841", # Assigned but unused (placeholders, unpacking)
    "F811", # Redefinition of unused name (platform overrides)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# ------------------------
# Core library (hardware, rendering, performance)
# ------------------------
"library/**/*.py" = [
    "E402",  # Lazy / platform-specific imports
    "F401",  # Side-effect imports
    "E741",  # Math / coordinate variables
]

# ------------------------
# Theme editor (Qt-heavy)
# ------------------------
"theme_editor/**/*.py" = [
    "F403",  # Qt wildcard imports
    "F405",
    "E402",
]

# ------------------------
# GUI / entry points
# ------------------------
"**/__main__.py" = ["E402"]
"**/main.py"     = ["E402"]

# ------------------------
# Tests & repro scripts
# ------------------------
"tests/**/*.py" = [
    "F401",
    "F841",
]
"repro_*.py" = [
    "F401",
    "F841",
    "E702",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
