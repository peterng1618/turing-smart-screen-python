author: '@antigravity'
display:
  DISPLAY_SIZE: 5.0"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 0, 255
video_background:
  ENABLE: true
  LOCAL_PATH: ../../videos/gunpla_processed.mp4
  START_OFFSET: 00:10
  DURATION: 01:00
  ROTATE: 0
  LOOP_FADE_DURATION: 1.5
  SOURCE_PATH: ../../videos/gunpla.mp4
  REMOTE_PATH: /mnt/SDCARD/video/gunpla_processed.mp4
static_images:
  # Specify what static images we want to show on the display
  # Images are drawn in the order listed (first = back, last = front)
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480
