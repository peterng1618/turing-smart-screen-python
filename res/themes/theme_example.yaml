# theme.yaml - Display Engine Reference
# This is the format read by the display engine (theme-editor.py, main.py)
# UI elements are NOT included here - they should be baked to background.png or background.mp4
# 
# For the full editor format with UI elements, see: theme-editor_example.yaml
---
# Author credit for theme
author: "@your_GitHub_username"

display:
  # Specify the display size in inch for this theme: 2.1", 3.5", 5" or 8.8"
  DISPLAY_SIZE: 3.5"
  
  # Specify the display orientation for this theme: portrait or landscape
  DISPLAY_ORIENTATION: portrait
  
  # Backplate RGB LED color (for HW revision 'flagship' devices only)
  DISPLAY_RGB_LED: 255, 0, 0

video_background:
  # VIDEO BACKGROUNDS (Revision C / 5" displays only)
  # Video backgrounds are FULLSCREEN and fill the entire display.
  # All dynamic text, stats, and graphs render as overlays on top of the video.
  # Video and static BACKGROUND image are mutually exclusive.
  #
  # IMPORTANT: This section is auto-generated by the theme editor.
  # Processing options (LOOP_FADE_DURATION, ROTATE, FLIP, etc.) are in theme-editor.yaml only.
  
  # Set to True to enable video background, False to use static image
  ENABLE: False
  
  # Local path to processed video (relative to theme directory)
  # Generated by theme editor from SOURCE_PATH in theme-editor.yaml
  LOCAL_PATH: background.mp4
  
  # Remote path on display's storage
  # System tries SD card first (/mnt/SDCARD/video/), then internal (/root/video/)
  REMOTE_PATH: /mnt/SDCARD/video/background.mp4

static_images:
  # Specify what static images we want to show on the display
  # Images are drawn in the order listed (first = back, last = front)
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 320
    HEIGHT: 480

static_text:
  # Specify what static text to show on the display (legacy format)
  # For new themes, consider using dynamic_text with sensor variables
  #
  # COLOR FORMAT:
  #   - RGB:  255, 255, 255       (3 values: Red, Green, Blue, alpha defaults to 255)
  #   - RGBA: 255, 255, 255, 128  (4 values: Red, Green, Blue, Alpha for transparency)
  #
  # OPACITY: Optional global opacity (0.0 to 1.0), applied on top of color alpha
  #
  TEXT_EXAMPLE:
    TEXT: Add your custom text here!
    X: 20
    Y: 400
    FONT: geforce/GeForce-Bold.ttf
    FONT_SIZE: 20
    FONT_COLOR: 0, 0, 0          # RGB format (fully opaque)
    # FONT_COLOR: 0, 0, 0, 128   # RGBA format (50% transparent)
    # OPACITY: 0.5               # Optional: global opacity multiplier
    BACKGROUND_IMAGE: background.png
    ALIGN: left
    ANCHOR: lt

STATS:
  # Hardware sensor display configuration
  # Each sensor type has its own section with INTERVAL and display options
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 100
        Y: 20
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 255, 255, 255     # RGB (opaque) or RGBA (with alpha)
        # OPACITY: 1.0                # Optional: 0.0-1.0, defaults to 1.0
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
      GRAPH:
        SHOW: False
        X: 115
        Y: 71
        WIDTH: 178
        HEIGHT: 13
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 0, 0
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
      RADIAL:
        SHOW: False
        X: 100
        Y: 110
        RADIUS: 40
        WIDTH: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 120
        ANGLE_END: 60
        ANGLE_STEPS: 20
        ANGLE_SEP: 5
        CLOCKWISE: True
        BAR_COLOR: 0, 255, 0
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 200, 200, 200
        BACKGROUND_IMAGE: background.png
      LINE_GRAPH:
        SHOW: False
        X: 300
        Y: 220
        WIDTH: 133
        HEIGHT: 70
        MIN_VALUE: 0
        MAX_VALUE: 100
        HISTORY_SIZE: 10
        AUTOSCALE: False
        LINE_COLOR: 61, 184, 225
        LINE_WIDTH: 2
        AXIS: True
        AXIS_COLOR: 255, 135, 0
        AXIS_FONT: roboto/Roboto-Black.ttf
        AXIS_FONT_SIZE: 10
        BACKGROUND_IMAGE: background.png
    TEMPERATURE:
      INTERVAL: 5
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 154
        Y: 13
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 23
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  GPU:
    INTERVAL: 1
    PERCENTAGE:
      GRAPH:
        SHOW: False
        X: 115
        Y: 197
        WIDTH: 178
        HEIGHT: 13
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 0, 0
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
      RADIAL:
        SHOW: False
        X: 141
        Y: 275
        RADIUS: 28
        WIDTH: 8
        MIN_VALUE: 0
        MAX_VALUE: 100
        ANGLE_START: 110
        ANGLE_END: 70
        ANGLE_STEPS: 1
        ANGLE_SEP: 25
        CLOCKWISE: True
        BAR_COLOR: 255, 0, 0
        SHOW_TEXT: True
        SHOW_UNIT: True
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 13
        FONT_COLOR: 200, 200, 200
        BACKGROUND_IMAGE: background.png
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 250
        Y: 140
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 23
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
    TEMPERATURE:
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 154
        Y: 13
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 23
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  MEMORY:
    INTERVAL: 1
    VIRTUAL:
      GRAPH:
        SHOW: False
        X: 115
        Y: 323
        WIDTH: 178
        HEIGHT: 13
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 255, 0, 0
        BAR_OUTLINE: False
        BACKGROUND_IMAGE: background.png
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 250
        Y: 267
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 23
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  DATE:
    INTERVAL: 1
    DAY:
      TEXT:
        SHOW: False
        X: 10
        Y: 10
        FONT: roboto/Roboto-Regular.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt
  UPTIME:
    INTERVAL: 60
    FORMATTED:
      TEXT:
        SHOW: False
        SHOW_UNIT: True
        X: 10
        Y: 460
        FONT: roboto/Roboto-Regular.ttf
        FONT_SIZE: 12
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
        ALIGN: left
        ANCHOR: lt

# Dynamic Text Configuration
# Allows embedding sensor values with variables like {CPU_PERCENTAGE:u}
# FLAGS: u = with unit, nu = no unit, r = raw value
dynamic_text:
  INTERVAL: 1
  SYSTEM_SUMMARY:
    SHOW: True
    TEXT: "CPU: {CPU_PERCENTAGE:u} | GPU: {GPU_PERCENTAGE:u} | RAM: {MEM_VIRTUAL_PERCENT:u}"
    X: 10
    Y: 450
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 12
    FONT_COLOR: 255, 255, 255
    BACKGROUND_IMAGE: background.png
    ALIGN: left
    ANCHOR: lt
  STYLED_DYNAMIC_TEXT:
    SHOW: True
    TEXT: "Styled Variable: {CPU_PERCENTAGE:u}"
    X: 10
    Y: 410
    FONT: roboto-mono/RobotoMono-Bold.ttf
    FONT_SIZE: 14
    FONT_COLOR: 255, 200, 0
    angle: 5
    opacity: 0.8
    shadow:
      color: 0, 0, 0
      blur: 3
      offset_x: 2
      offset_y: 2
